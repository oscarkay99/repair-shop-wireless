name: Deploy to Production

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy to operations.wirelesscares.com
        env:
          DEPLOY_KEY: ${{ secrets.WIRELESS_DEPLOY_SSH_KEY }}
        run: |
          install -m 600 -D /dev/null deploy_key
          echo "$DEPLOY_KEY" > deploy_key
          for attempt in 1 2 3; do
            if tar -czf - -C out . | ssh -i deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 root@187.127.233.218; then
              exit 0
            fi
            echo "Deploy attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "Deploy failed after 3 attempts"
          exit 1
